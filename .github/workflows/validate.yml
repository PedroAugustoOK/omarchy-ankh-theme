name: Validate Omarchy theme

on:
  push:
  pull_request:

jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate palette and image assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          import tomllib
          import re

          root = Path('.')
          palette = tomllib.loads((root / 'colors.toml').read_text())
          assert palette.get('mode') == 'light', 'colors.toml must define mode = "light"'
          colors = {key: value for key, value in palette.items() if key != 'mode'}
          assert len(colors) >= 20, 'palette is missing semantic colors'
          assert all(re.fullmatch(r'#[0-9A-Fa-f]{6}', value) for value in colors.values()), 'invalid hex color'

          def contrast(first, second):
              def luminance(color):
                  channels = [int(color[index:index + 2], 16) / 255 for index in (1, 3, 5)]
                  linear = [channel / 12.92 if channel <= 0.04045 else ((channel + 0.055) / 1.055) ** 2.4 for channel in channels]
                  return 0.2126 * linear[0] + 0.7152 * linear[1] + 0.0722 * linear[2]
              one, two = luminance(first), luminance(second)
              return (max(one, two) + 0.05) / (min(one, two) + 0.05)

          assert contrast(palette['foreground'], palette['background']) >= 7, 'body text contrast must be at least 7:1'
          assert contrast(palette['accent'], palette['background']) >= 4.5, 'accent contrast must be at least 4.5:1'
          assert contrast(palette['muted'], palette['background']) >= 4.5, 'muted text contrast must be at least 4.5:1'

          required_assets = {
              'shell.toml', 'gtk.css', 'walker.css', 'mako.ini', 'swayosd.css',
              'waybar.css', 'btop.theme', 'chromium.theme', 'superfile.toml',
              'zed.json', 'cava_theme', 'fzf.fish', 'steam.css', 'vencord.theme.css',
          }
          missing = sorted(name for name in required_assets if not (root / name).is_file())
          assert not missing, f'missing themed integration files: {", ".join(missing)}'

          shell = tomllib.loads((root / 'shell.toml').read_text())
          required_shell_sections = {'bar', 'controls', 'spacing', 'font', 'popups', 'tooltip', 'notifications', 'launcher', 'menu', 'polkit', 'lock', 'image-picker'}
          assert required_shell_sections <= set(shell), 'shell.toml is missing required surface sections'

          preview = root / 'preview.png'
          assert preview.is_file(), 'preview.png is required'

          def png_size(path):
              with path.open('rb') as image:
                  assert image.read(8) == b'\x89PNG\r\n\x1a\n', f'{path} is not a PNG'
                  image.read(4)
                  assert image.read(4) == b'IHDR', f'{path} has no IHDR'
                  width, height = struct.unpack('>II', image.read(8))
                  return width, height

          width, height = png_size(preview)
          assert width >= 1000 and height >= 500, 'preview.png is too small'
          ratio = width / height
          assert abs(ratio - (16 / 9)) < 0.03, 'preview.png should be 16:9'

          wallpapers = sorted((root / 'backgrounds').glob('*.png'))
          assert len(wallpapers) == 3, 'exactly three wallpapers are required'
          for wallpaper in wallpapers:
              width, height = png_size(wallpaper)
              ratio = width / height
              assert abs(ratio - (16 / 9)) < 0.03, f'{wallpaper} should be 16:9'

          unlock_preview = root / 'preview-unlock.png'
          assert unlock_preview.is_file(), 'preview-unlock.png is required'
          width, height = png_size(unlock_preview)
          assert abs((width / height) - (16 / 9)) < 0.03, 'preview-unlock.png should be 16:9'

          print(f'Validated {len(colors)} colors, shell surfaces, integrations, previews, and {len(wallpapers)} wallpapers.')
          PY
