name: Validate Omarchy theme

on:
  push:
  pull_request:

jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate palette and image assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          import tomllib
          import re

          root = Path('.')
          palette = tomllib.loads((root / 'colors.toml').read_text())
          assert palette.get('mode') == 'light', 'colors.toml must define mode = "light"'
          colors = {key: value for key, value in palette.items() if key != 'mode'}
          assert len(colors) >= 20, 'palette is missing semantic colors'
          assert all(re.fullmatch(r'#[0-9A-Fa-f]{6}', value) for value in colors.values()), 'invalid hex color'

          preview = root / 'preview.png'
          assert preview.is_file(), 'preview.png is required'

          def png_size(path):
              with path.open('rb') as image:
                  assert image.read(8) == b'\x89PNG\r\n\x1a\n', f'{path} is not a PNG'
                  image.read(4)
                  assert image.read(4) == b'IHDR', f'{path} has no IHDR'
                  width, height = struct.unpack('>II', image.read(8))
                  return width, height

          width, height = png_size(preview)
          assert width >= 1000 and height >= 500, 'preview.png is too small'
          ratio = width / height
          assert abs(ratio - (16 / 9)) < 0.03, 'preview.png should be 16:9'

          wallpapers = sorted((root / 'backgrounds').glob('*.png'))
          assert len(wallpapers) >= 6, 'three standard and three ultrawide wallpapers are required'
          for wallpaper in wallpapers:
              width, height = png_size(wallpaper)
              ratio = width / height
              allowed = abs(ratio - (16 / 9)) < 0.03 or abs(ratio - (21 / 9)) < 0.03
              assert allowed, f'{wallpaper} should be 16:9 or 21:9'

          unlock_preview = root / 'preview-unlock.png'
          assert unlock_preview.is_file(), 'preview-unlock.png is required'
          width, height = png_size(unlock_preview)
          assert abs((width / height) - (16 / 9)) < 0.03, 'preview-unlock.png should be 16:9'

          print(f'Validated {len(colors)} colors, preview, and {len(wallpapers)} wallpapers.')
          PY
