name: Bug report
description: Report a reproducible problem with this Omarchy theme.
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Ankh. Please do not attach screenshots containing personal data.
  - type: input
    id: omarchy
    attributes:
      label: Omarchy version
      placeholder: "4.0.4"
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Theme installation
        - Wallpaper
        - Quickshell bar or menu
        - Lock screen
        - Notification or launcher
        - Application integration
        - Documentation
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Apply the theme...\n2. Open..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include monitor scale, theme variant, and safe screenshots if relevant.
