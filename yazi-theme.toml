# Ankh companion palette for Yazi.
# Merge into ~/.config/yazi/theme.toml; it deliberately avoids layout settings.

[manager]
cwd = { fg = "#466E92" }
hovered = { fg = "#F4F6F8", bg = "#466E92" }
preview_hovered = { underline = true }
find_keyword = { fg = "#A98955", italic = true }
find_position = { fg = "#897A98", bg = "reset", italic = true }
marker_selected = { fg = "#668C77", bg = "#668C77" }
marker_copied = { fg = "#638E99", bg = "#638E99" }
marker_cut = { fg = "#B86B73", bg = "#B86B73" }
tab_active = { fg = "#243746", bg = "#E8EDF1" }
tab_inactive = { fg = "#5F717D", bg = "#F4F6F8" }
border_symbol = "│"
border_style = { fg = "#D5DEE6" }

[status]
separator_open = ""
separator_close = ""
separator_style = { fg = "#E8EDF1", bg = "#E8EDF1" }
mode_normal = { fg = "#F4F6F8", bg = "#466E92", bold = true }
mode_select = { fg = "#F4F6F8", bg = "#668C77", bold = true }
mode_unset = { fg = "#F4F6F8", bg = "#A98955", bold = true }
progress_label = { fg = "#243746", bold = true }
progress_normal = { fg = "#466E92", bg = "#D5DEE6" }
progress_error = { fg = "#B86B73", bg = "#D5DEE6" }

[input]
border = { fg = "#466E92" }
title = { fg = "#243746" }
value = { fg = "#243746" }
selected = { reversed = true }

[select]
border = { fg = "#466E92" }
active = { fg = "#F4F6F8", bg = "#466E92" }
inactive = { fg = "#243746" }

[which]
mask = { bg = "#F4F6F8" }
cand = { fg = "#466E92" }
rest = { fg = "#5F717D" }
desc = { fg = "#243746" }
separator = "  "
separator_style = { fg = "#5F717D" }
