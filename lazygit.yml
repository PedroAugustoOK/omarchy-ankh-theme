# Ankh companion configuration for Lazygit.
# Merge the gui.theme block into ~/.config/lazygit/config.yml.
gui:
  theme:
    activeBorderColor:
      - '#466E92'
      - bold
    inactiveBorderColor:
      - '#5F717D'
    searchingActiveBorderColor:
      - '#638E99'
      - bold
    optionsTextColor:
      - '#466E92'
    selectedLineBgColor:
      - '#DCE7F1'
    selectedRangeBgColor:
      - '#D5DEE6'
    cherryPickedCommitBgColor:
      - '#D5DEE6'
    cherryPickedCommitFgColor:
      - '#243746'
    unstagedChangesColor:
      - '#B86B73'
    defaultFgColor:
      - '#243746'
